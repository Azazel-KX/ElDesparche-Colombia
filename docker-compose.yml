version: "3.8"

services:
  database:
    image: postgis/postgis:15-3.3-alpine
    container_name: desparche_db_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: desparche_db
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: desparche_pgadmin_container
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eldesparche.online
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - database
