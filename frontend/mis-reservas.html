    <link rel="stylesheet" href="css/estilos.css" />
  
  <!-- Aplica el tamaño de texto guardado antes del primer pintado, para que
       la página no dé un salto visual al cargar. -->
  <script>
    (function () {
      try {
        var v = localStorage.getItem("escalaTexto");
        if (v) document.documentElement.style.setProperty("--escala-texto", v);
      } catch (e) { /* modo privado: se queda en el tamaño normal */ }
    })();
  </script>
</head>

  <body data-pagina="mis-reservas">
    <!-- ===== CABECERA ===== -->
    <!--@incluir cabecera-->

    <main class="fondo-gris">
      <section class="seccion">
        <h1>Mis reservas</h1>
        <p class="texto-gris" id="saludo"></p>
        <p class="aviso-lista" id="aviso-reservas" role="status" tabindex="-1"></p>

        <!-- El script escribe aquí la tabla o el mensaje de "sin reservas" -->
        <div id="contenido-reservas"></div>

        <p class="ayuda">
          💬 ¿Necesitas ayuda con una reserva? Escríbenos a
          <a href="mailto:soporte@eldesparche.online"
            >soporte@eldesparche.online</a
          >
          o visita nuestra sección de <a href="nosotros.html#preguntas-frecuentes">preguntas frecuentes</a>.
        </p>
      </section>
    </main>

    <!-- ===== PIE DE PÁGINA ===== -->

    <script type="module" src="src/paginas/mis-reservas.js"></script>
  </body>
