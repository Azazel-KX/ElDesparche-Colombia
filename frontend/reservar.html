<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-m62wOcyBidVqVxOSvCeZaCvF5VIK4XOF9YP7a4I0Yug='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://nominatim.openstreetmap.org; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservar - El Desparche</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />

  <!-- Tipografías del diseño -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Geist:wght@400;600;700&family=Outfit:wght@800&family=Kadwa&family=Source+Sans+3:wght@600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilos.css">

  <!-- Aplica el tamaño de texto guardado antes del primer pintado, para que
       la página no dé un salto visual al cargar. -->
  <script>
    (function () {
      try {
        var v = localStorage.getItem("escalaTexto");
        if (v) document.documentElement.style.setProperty("--escala-texto", v);
      } catch (e) { /* modo privado: se queda en el tamaño normal */ }
    })();
  </script>
</head>

<body data-pagina="reservar">

  <!-- ===== CABECERA ===== -->
    <!--@incluir cabecera-->

  <main class="fondo-gris">
    <section class="seccion">

      <p class="migas">
        <a href="eventos.html">Eventos</a> /
        <a id="miga-evento" href="#"></a> /
        <span>Formulario de reserva</span>
      </p>

      <h1>Formulario de reserva</h1>

      <!-- En computador el formulario y el resumen van lado a lado -->
      <div class="reserva-columnas">

        <!-- ===== DATOS DE LA RESERVA ===== -->
        <form class="caja" id="form-reserva" novalidate>
          <h2 class="titulo-caja">Datos de la reserva</h2>

          <!-- Resumen corto del evento -->
          <div class="mini-evento">
            <img id="mini-imagen" src="" alt="">
            <div>
              <p class="negrita" id="mini-titulo"></p>
              <p id="mini-lugar"></p>
              <p id="mini-fecha"></p>
            </div>
          </div>

          <div class="campo">
            <label for="tickets">Número de tickets</label>
            <div class="contador-tickets">
              <button type="button" id="menos" aria-label="Quitar un ticket">−</button>
              <output id="tickets">1</output>
              <button type="button" id="mas" aria-label="Añadir un ticket">+</button>
              <span class="limite">máx. 10 por persona</span>
            </div>
          </div>

          <div class="campo">
            <label for="observaciones">
              Observaciones <span class="opcional">(opcional)</span>
            </label>
            <textarea id="observaciones" rows="4" maxlength="1000"
              placeholder="¿Necesitas asistencia especial, alergias, preferencias de asiento?"></textarea>
          </div>

          <p class="aviso-morado" id="aviso-usuario"></p>
        </form>

        <!-- ===== RESUMEN DE PRECIOS ===== -->
        <aside class="caja">
          <h2 class="titulo-caja">Resumen de tu reserva</h2>

          <img class="imagen-resumen" id="resumen-imagen" src="" alt="">
          <p class="negrita" id="resumen-titulo"></p>
          <p class="texto-gris" id="resumen-fecha"></p>

          <dl class="resumen">
            <div>
              <dt>Precio unitario</dt>
              <dd id="resumen-precio"></dd>
            </div>
            <div>
              <dt>Cantidad</dt>
              <dd id="resumen-cantidad"></dd>
            </div>
            <div class="resumen-total">
              <dt>Total</dt>
              <dd id="resumen-total"></dd>
            </div>
          </dl>

          <!-- Está fuera del <form> (otra columna): el atributo form lo une, así Enter también envía -->
          <button class="boton boton-morado boton-ancho" type="submit" form="form-reserva" id="confirmar">
            Confirmar reserva
          </button>

          <p class="texto-pequeno">
            Al confirmar aceptas los términos y condiciones de El Desparche.
            La reserva no es transferible.
          </p>
        </aside>

      </div>
    </section>
  </main>

  <!-- ===== PIE DE PÁGINA ===== -->
    <!--@incluir pie-->

  <script type="module" src="src/paginas/reservar.js"></script>
</body>
</html>
