<header class="cabecera cabecera-plegable" role="banner">
      <button type="button" class="boton-menu" id="boton-menu"
              aria-expanded="false" aria-controls="menu-principal menu-cuenta">
        <span class="boton-menu-icono" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>Menú</span>
      </button>

      <div class="cabecera-izquierda">
        <a
          class="logo"
          href="index.html"
          aria-label="El Desparche, ir a la página de inicio"
        >
          <img
            class="logo-texto"
            src="img/logo-eldesparche.svg"
            alt=""
            aria-hidden="true"
          />
        </a>

        <nav class="menu" id="menu-principal" role="navigation" aria-label="Navegación principal">
          <ul>
            <li>
              <a href="index.html"{{activo:inicio}}>Inicio</a>
            </li>
            <li><a href="eventos.html"{{activo:eventos}}>Eventos</a></li>
            <li><a href="mis-reservas.html"{{activo:mis-reservas}}>Mis reservas</a></li>
          </ul>
        </nav>
      </div>

      <div class="cabecera-derecha" id="menu-cuenta">
        <!-- El script escribe aquí los botones de acceso o los datos del usuario -->
        <div class="sesion" id="sesion" aria-label="Sesión de usuario"></div>

        <!-- ===== BOTÓN DE ACCESIBILIDAD (patron "disclosure") =====
           aria-expanded es un ESTADO: dice si el panel esta abierto o
           cerrado, y el lector de pantalla lo anuncia en cada pulsación
           ("contraído" / "expandido"). aria-controls lo enlaza con el
           panel que abre. El panel se oculta con el atributo hidden, que
           lo saca del orden de tabulación y también del lector: así no se
           puede llegar con el teclado a botones que no se ven. -->
        <div class="accesibilidad">
          <button
            type="button"
            class="boton-accesibilidad"
            id="abrir-accesibilidad"
            aria-expanded="false"
            aria-controls="panel-accesibilidad"
          >
            <span>Accesibilidad</span>
            <!-- La flecha va en el marcado con aria-hidden, no como
               contenido generado en CSS: el contenido de ::after SÍ entra
               en el nombre accesible del botón en algunos navegadores, y
               el lector acabaría diciendo "Accesibilidad triángulo". -->
            <span class="flecha-accesibilidad" aria-hidden="true">&#9662;</span>
          </button>

          <div class="panel-accesibilidad" id="panel-accesibilidad" hidden>
            <h2 class="panel-titulo" id="titulo-panel-acc">
              Opciones de accesibilidad
            </h2>

            <!-- role="group" + aria-labelledby agrupan los botones bajo un
               mismo nombre, para que el lector anuncie de qué van antes
               de leer cada uno. -->
            <div
              class="tamano-texto"
              role="group"
              aria-labelledby="titulo-tamano"
            >
              <span class="oculto" id="titulo-tamano">Tamaño del texto</span>

              <button
                type="button"
                class="tamano-menor"
                id="texto-menos"
                aria-label="Disminuir el tamaño del texto"
              >
                A<span aria-hidden="true">&minus;</span>
              </button>

              <!-- Señal visible del estado. El lector no lo lee (ya se lo
                 anuncia la región role="status") para no repetirlo. -->
              <span class="tamano-valor" id="texto-valor" aria-hidden="true"
                >100%</span
              >

              <button
                type="button"
                class="tamano-mayor"
                id="texto-mas"
                aria-label="Aumentar el tamaño del texto"
              >
                A<span aria-hidden="true">+</span>
              </button>

              <button
                type="button"
                class="tamano-reinicio"
                id="texto-normal"
                aria-label="Restablecer el tamaño normal del texto"
              >
                Normal
              </button>
            </div>

            <p class="panel-ayuda">
              Se guarda en este navegador para tus próximas visitas.
            </p>
          </div>
        </div>

        <!-- Anuncia el nuevo tamaño en voz alta al pulsar (WCAG 4.1.3) -->
        <p
          class="oculto"
          id="aviso-tamano"
          role="status"
          aria-live="polite"
        ></p>
      </div>
    </header>
