<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-m62wOcyBidVqVxOSvCeZaCvF5VIK4XOF9YP7a4I0Yug='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://nominatim.openstreetmap.org; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva confirmada - El Desparche</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />

  <!-- Tipografías del diseño -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Geist:wght@400;600;700&family=Outfit:wght@800&family=Kadwa&family=Source+Sans+3:wght@600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilos.css">

  <!-- Aplica el tamaño de texto guardado antes del primer pintado, para que
       la página no dé un salto visual al cargar. -->
  <script>
    (function () {
      try {
        var v = localStorage.getItem("escalaTexto");
        if (v) document.documentElement.style.setProperty("--escala-texto", v);
      } catch (e) { /* modo privado: se queda en el tamaño normal */ }
    })();
  </script>
</head>

<body data-pagina="confirmacion">

  <!-- ===== CABECERA ===== -->
    <!--@incluir cabecera-->

  <main class="fondo-gris">
    <section class="seccion seccion-centrada">

      <img class="sello" src="img/bf734.svg" alt="">
      <h1 class="titulo-exito">¡Tu reserva está lista!</h1>
      <p class="subtitulo-exito">
        Tu reserva ha sido registrada exitosamente. Guarda tu código o
        presenta el QR en la entrada del evento.
      </p>

      <!-- En computador los detalles y el QR van lado a lado -->
      <div class="confirmacion-columnas">
        <div class="caja">
          <h2 class="titulo-caja">Detalles de la reserva</h2>
          <dl class="ficha" id="detalles"></dl>
        </div>

        <aside class="caja-qr">
          <div class="qr" id="qr"></div>
          <p class="codigo" id="codigo"></p>
          <p class="texto-pequeno-claro">Presenta este QR en la entrada del evento</p>
        </aside>
      </div>

      <div class="botones">
        <a class="boton boton-morado" href="mis-reservas.html">Ver mis reservas</a>
        <a class="boton boton-borde" href="index.html">Volver al inicio</a>
      </div>

    </section>
  </main>

  <!-- ===== PIE DE PÁGINA ===== -->
    <!--@incluir pie-->

  <script type="module" src="src/paginas/confirmacion.js"></script>
</body>
</html>
