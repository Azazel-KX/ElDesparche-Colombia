<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-m62wOcyBidVqVxOSvCeZaCvF5VIK4XOF9YP7a4I0Yug='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://nominatim.openstreetmap.org; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos - El Desparche</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />

  <!-- Tipografías del diseño -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Geist:wght@400;600;700&family=Outfit:wght@800&family=Kadwa&family=Source+Sans+3:wght@600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilos.css">

  <!-- Aplica el tamaño de texto guardado antes del primer pintado, para que
       la página no dé un salto visual al cargar. -->
  <script>
    (function () {
      try {
        var v = localStorage.getItem("escalaTexto");
        if (v) document.documentElement.style.setProperty("--escala-texto", v);
      } catch (e) { /* modo privado: se queda en el tamaño normal */ }
    })();
  </script>
</head>

<body data-pagina="eventos">

  <!-- ===== CABECERA ===== -->
    <!--@incluir cabecera-->

  <main class="fondo-gris">
    <section class="seccion">

      <div class="recuadro-titulo">
        <h1>Encuentra tu próximo plan</h1>
        <p class="texto-gris">
          Explora conciertos, teatro, festivales y experiencias en toda Colombia.
        </p>
      </div>

      <!-- ===== FILTROS ===== -->
      <form class="filtros" id="filtros-eventos">
        <div class="caja-busqueda">
          <img src="img/66766.svg" alt="">
          <label class="oculto" for="busqueda">Buscar</label>
          <input type="search" id="busqueda" placeholder="Buscar" autocomplete="off">
        </div>

        <div class="campo-filtro">
          <label class="oculto" for="ciudad">Ciudad</label>
          <select id="ciudad">
            <!-- Las ciudades las llena el script con las de los eventos publicados -->
            <option>Todas</option>
          </select>
        </div>

        <div class="campo-filtro">
          <label class="oculto" for="estado">Estado</label>
          <select id="estado">
            <option>Todos</option>
            <option>Programado</option>
            <option>En Boletería</option>
            <option>En Vivo</option>
            <option>Finalizado</option>
            <option>Cancelado</option>
          </select>
        </div>
      </form>

      <p class="contador" id="contador"></p>
      <p class="orden">Ordenar: Próximos primero</p>

      <!-- El script escribe aquí las tarjetas -->
      <ul class="tarjetas" id="lista-eventos" aria-label="Resultados de eventos"></ul>

    </section>
  </main>

  <!-- ===== PIE DE PÁGINA ===== -->
    <!--@incluir pie-->

  <script type="module" src="src/paginas/eventos.js"></script>
</body>
</html>
