<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-m62wOcyBidVqVxOSvCeZaCvF5VIK4XOF9YP7a4I0Yug='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://nominatim.openstreetmap.org; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos - El Desparche</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />

  <!-- Tipografías del diseño -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Geist:wght@400;600;700&family=Outfit:wght@800&family=Kadwa&family=Source+Sans+3:wght@600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilos.css">

  <!-- Aplica el tamaño de texto guardado antes del primer pintado, para que
       la página no dé un salto visual al cargar. -->
  <script>
    (function () {
      try {
        var v = localStorage.getItem("escalaTexto");
        if (v) document.documentElement.style.setProperty("--escala-texto", v);
      } catch (e) { /* modo privado: se queda en el tamaño normal */ }
    })();
  </script>
</head>

<body data-pagina="eventos">

  <!-- ===== CABECERA ===== -->
    <!--@incluir cabecera-->

  <main class="fondo-gris">
    <section class="seccion">

      <!-- La cabecera es una boleta: el título a la izquierda y, tras la línea de corte, el talón con cuántos eventos hay -->
      <header class="boleta-eventos">
        <div class="boleta-cuerpo">
          <h1>Encuentra tu próximo plan</h1>
          <p>Conciertos, teatro, festivales y mucho más, en Colombia y en otros países.</p>
        </div>
        <p class="boleta-talon" id="contador" role="status" aria-live="polite"></p>
      </header>

      <!-- ===== BUSCADOR Y FILTROS ===== -->
      <form class="barra-filtros" id="filtros-eventos" role="search" aria-label="Buscar y filtrar eventos">
        <div class="barra-filtros-fila">
          <div class="caja-busqueda">
            <img src="img/66766.svg" alt="">
            <label class="oculto" for="busqueda">Buscar por nombre del evento o ciudad</label>
            <input type="search" id="busqueda" placeholder="Busca por nombre del evento o por ciudad" autocomplete="off">
          </div>

          <div class="filtro-desplegable">
            <button type="button" class="boton-filtros" id="abrir-filtros" aria-expanded="false" aria-controls="panel-filtros">
              <svg class="icono-filtros" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
              <span>Filtros</span>
              <span class="filtros-activos" id="filtros-activos" hidden></span>
              <span class="flecha-accesibilidad" aria-hidden="true">&#9662;</span>
            </button>

            <div class="filtro-panel" id="panel-filtros" role="group" aria-label="Filtros de eventos" hidden>
              <p class="filtro-panel-guia">Elige el país y se abren sus departamentos y ciudades.</p>

              <!-- Primero se elige el país, luego su departamento y por último la ciudad -->
              <div class="filtro-panel-campos">
                <div class="campo-etiquetado">
                  <label for="pais">País</label>
                  <select id="pais">
                    <!-- Los países los llena el script con los de los eventos publicados -->
                    <option value="">Todos</option>
                  </select>
                </div>

                <div class="campo-etiquetado">
                  <label for="departamento">Departamento</label>
                  <select id="departamento" disabled aria-describedby="ayuda-departamento">
                    <option value="">Todos</option>
                  </select>
                  <p class="ayuda-campo" id="ayuda-departamento">Elige primero un país.</p>
                </div>

                <div class="campo-etiquetado">
                  <label for="ciudad">Ciudad</label>
                  <select id="ciudad" disabled aria-describedby="ayuda-ciudad">
                    <option value="">Todas</option>
                  </select>
                  <p class="ayuda-campo" id="ayuda-ciudad">Elige primero un departamento.</p>
                </div>

                <div class="campo-etiquetado">
                  <label for="estado">Estado del evento</label>
                  <select id="estado">
                    <option value="">Todos</option>
                    <option>Programado</option>
                    <option>En Boletería</option>
                    <option>En Vivo</option>
                    <option>Finalizado</option>
                    <option>Cancelado</option>
                  </select>
                </div>
              </div>

              <div class="filtro-panel-pie">
                <button type="button" class="boton-limpiar" id="limpiar-filtros">Limpiar filtros</button>
                <button type="button" class="enlace-ver-todos" id="cerrar-filtros">Listo</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Lo que está aplicado, a la vista aunque el panel esté cerrado; cada etiqueta se quita con un clic -->
        <ul class="filtros-chips" id="filtros-chips" aria-label="Filtros aplicados" hidden></ul>
      </form>

      <p class="orden">Ordenar: Próximos primero</p>

      <!-- El script escribe aquí las tarjetas -->
      <ul class="tarjetas" id="lista-eventos" aria-label="Resultados de eventos"></ul>

    </section>
  </main>

  <!-- ===== PIE DE PÁGINA ===== -->
    <!--@incluir pie-->

  <script type="module" src="src/paginas/eventos.js"></script>
</body>
</html>
