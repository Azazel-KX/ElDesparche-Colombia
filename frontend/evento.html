<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-m62wOcyBidVqVxOSvCeZaCvF5VIK4XOF9YP7a4I0Yug='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://nominatim.openstreetmap.org; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del evento - El Desparche</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />

  <!-- Tipografías del diseño -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Geist:wght@400;600;700&family=Outfit:wght@800&family=Kadwa&family=Source+Sans+3:wght@600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilos.css">

  <!-- Aplica el tamaño de texto guardado antes del primer pintado, para que
       la página no dé un salto visual al cargar. -->
  <script>
    (function () {
      try {
        var v = localStorage.getItem("escalaTexto");
        if (v) document.documentElement.style.setProperty("--escala-texto", v);
      } catch (e) { /* modo privado: se queda en el tamaño normal */ }
    })();
  </script>
</head>

<body data-pagina="evento">

  <!-- ===== CABECERA ===== -->
    <!--@incluir cabecera-->

  <main class="fondo-gris">
    <article class="seccion">

      <p class="migas">
        <a href="eventos.html">Eventos</a> / <span id="miga-titulo"></span>
      </p>

      <figure class="portada-evento">
        <img id="evento-imagen" src="" alt="">
      </figure>

      <!-- En computador estas dos columnas van lado a lado -->
      <div class="detalle-columnas">
        <div class="detalle-texto">
          <p class="estado estado-grande" id="evento-estado"></p>
          <h1 class="detalle-titulo" id="evento-titulo"></h1>
          <p class="detalle-descripcion" id="evento-descripcion"></p>
        </div>

        <aside class="caja-reserva">
          <h2>Precio base</h2>
          <p class="precio-grande" id="evento-precio"></p>
          <a class="boton boton-morado boton-ancho" id="boton-reservar" href="#">Reservar</a>
          <p class="aviso" id="evento-cupos"></p>
        </aside>
      </div>

      <!-- ===== FICHA DEL EVENTO ===== -->
      <section class="caja">
        <h2>Información del evento</h2>
        <dl class="ficha" id="evento-ficha"></dl>
      </section>

      <!-- ===== UBICACIÓN ===== -->
      <section class="caja">
        <h2>Ubicación</h2>
        <p class="texto-gris" id="evento-lugar"></p>
        <iframe id="evento-mapa" title="Mapa de la ubicación del evento" src="" loading="lazy"></iframe>
        <p><a class="enlace" id="evento-mapa-enlace" href="#" target="_blank" rel="noreferrer">Ver en OpenStreetMap →</a></p>
      </section>

    </article>
  </main>

  <!-- ===== PIE DE PÁGINA ===== -->
    <!--@incluir pie-->

  <script type="module" src="src/paginas/evento.js"></script>
</body>
</html>
