# Despliegue del backend en Render (Blueprint). En Render: New -> Blueprint -> elegir este repo.
# Las variables con sync:false se piden al crear el servicio (no se guardan en el repo).
services:
  - type: web
    name: eldesparche-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL        # cadena de Neon (Connect -> Connection string)
        sync: false
      - key: JWT_SECRET
        generateValue: true      # Render genera uno aleatorio
      - key: CORS_ORIGIN         # URL del frontend, ej. https://eldesparche.online
        sync: false
      - key: PUBLIC_URL          # URL pública del API, ej. https://eldesparche-api.onrender.com
        sync: false
